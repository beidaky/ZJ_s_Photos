<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff9fa">
  <title>ZJ's Photo | 相册</title>

  <!-- 不再依赖 Tailwind / Google Fonts，减少首次访问的额外网络请求 -->
  <link rel="preload" as="image" href="./images/p01.jpg" fetchpriority="high">
  <link rel="preload" as="image" href="./images/p02.jpg" fetchpriority="high">

  <style>
    :root {
      --bg: #fff9fa;
      --text: #4a4a4a;
      --accent: #f06292;
      --soft: #fce4ec;
      --card: #fff;
      --glass: rgba(255,255,255,.78);
      --line: rgba(240,98,146,.18);
    }
    [data-theme="dark"] {
      --bg: #120f10;
      --text: #fce4ec;
      --accent: #ff80ab;
      --soft: #2a1b1f;
      --card: #1a1617;
      --glass: rgba(18,15,16,.78);
      --line: rgba(255,128,171,.18);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color .22s ease, color .22s ease;
    }
    button { font: inherit; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    * { scrollbar-width: none; }

    /* 极轻的背景装饰：不再使用全屏 canvas + 每帧粒子 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background:
        radial-gradient(circle at 50% -10%, rgba(240,98,146,.08), transparent 38%),
        radial-gradient(circle at 100% 60%, rgba(240,98,146,.035), transparent 35%);
    }

    #loading {
      min-height: 100svh;
      display: grid;
      place-items: center;
      color: rgba(240,98,146,.65);
      letter-spacing: .18em;
      font-size: 12px;
    }
    .loading-inner { text-align:center; }
    .loading-ring {
      width: 28px;
      height: 28px;
      margin: 0 auto 16px;
      border: 2px solid rgba(240,98,146,.14);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #app {
      opacity: 0;
      transition: opacity .35s ease;
    }
    #app.ready { opacity: 1; }

    main {
      width: min(1500px, calc(100% - 28px));
      margin: 0 auto;
      padding: 54px 0 100px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }
    h1 {
      margin: 0;
      color: rgba(240,98,146,.82);
      font-size: clamp(28px, 5vw, 54px);
      line-height: 1.15;
      font-style: italic;
      font-weight: 400;
      letter-spacing: .12em;
    }
    .divider {
      width: 58px;
      height: 1px;
      margin: 16px auto 0;
      background: linear-gradient(90deg, transparent, rgba(240,98,146,.45), transparent);
    }

    /* 单一 DOM 瀑布流：原版同时创建 desktop/mobile 两套卡片，这里只创建一套 */
    .gallery {
      column-count: 4;
      column-gap: 24px;
    }
    .photo-card {
      position: relative;
      display: inline-block;
      width: 100%;
      margin: 0 0 24px;
      overflow: hidden;
      break-inside: avoid;
      border-radius: 22px;
      background: var(--card);
      cursor: pointer;
      transform: translateZ(0);
      contain: paint;
      box-shadow: 0 8px 30px rgba(0,0,0,.035);
      transition: transform .22s ease, box-shadow .22s ease;
    }
    .photo-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(240,98,146,.12);
    }
    .photo-card:active { transform: scale(.985); }

    .photo-card img {
      display: block;
      width: 100%;
      height: auto;
      opacity: 0;
      background: linear-gradient(135deg, var(--soft), var(--bg));
      transition: opacity .25s ease;
    }
    .photo-card img.loaded { opacity: 1; }

    .placeholder {
      position: absolute;
      inset: 0;
      min-height: 160px;
      background: linear-gradient(135deg, var(--soft), var(--bg));
      animation: breathe 1.8s ease-in-out infinite alternate;
    }
    .photo-card.done .placeholder { display: none; }
    @keyframes breathe { from { opacity:.65 } to { opacity:1 } }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      background: rgba(0,0,0,.05);
      pointer-events: none;
      transition: opacity .18s ease;
    }
    .photo-card:hover .overlay { opacity: 1; }
    .overlay span {
      color: white;
      font-size: 30px;
      text-shadow: 0 3px 12px rgba(0,0,0,.45);
    }

    #controls {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ctrl-btn, #btn-music-play {
      border: 1px solid var(--line);
      outline: none;
      color: var(--accent);
      background: var(--glass);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
      cursor: pointer;
    }
    .ctrl-btn {
      width: 50px;
      height: 50px;
      padding: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: transform .16s ease, background-color .16s ease;
    }
    .ctrl-btn:hover { transform: scale(1.06); }
    .ctrl-btn:active { transform: scale(.94); }
    .ctrl-btn.active { background: rgba(240,98,146,.12); }

    .ctrl-btn svg { width: 22px; height: 22px; }

    #music-panel {
      position: fixed;
      left: max(16px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 40;
      min-width: 205px;
      max-width: calc(100vw - 90px);
      padding: 10px 13px 10px 11px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
    }
    #btn-music-play {
      width: 32px;
      height: 32px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      box-shadow: none;
    }
    #music-track-name {
      max-width: 145px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 11px;
      letter-spacing: .1em;
      color: rgba(240,98,146,.8);
      text-transform: uppercase;
    }
    #music-progress-wrap {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 4px;
      height: 1px;
      overflow: hidden;
      background: rgba(240,98,146,.1);
    }
    #music-progress-bar {
      width: 0;
      height: 100%;
      background: var(--accent);
    }

    /* Lightbox：只在打开时启用模糊，避免平时一直消耗合成性能 */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      background: rgba(255,249,250,.94);
      transition: opacity .2s ease, visibility .2s ease;
    }
    [data-theme="dark"] #lightbox { background: rgba(18,15,16,.94); }
    #lightbox.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    #lightbox-content {
      position: relative;
      max-width: 94vw;
      max-height: 90svh;
      transform: scale(.97);
      transition: transform .2s ease;
    }
    #lightbox.open #lightbox-content { transform: scale(1); }
    #lightbox-img {
      display: block;
      max-width: 94vw;
      max-height: 84svh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 18px;
      opacity: 1;
      transform: scale(1);
      transition: opacity .16s ease, transform .16s ease;
      box-shadow: 0 25px 70px rgba(0,0,0,.25);
      background: var(--card);
    }
    #lightbox-prev, #lightbox-next {
      position: fixed;
      top: 50%;
      z-index: 101;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--accent);
      background: var(--glass);
      cursor: pointer;
      transform: translateY(-50%);
      font-size: 34px;
      line-height: 1;
    }
    #lightbox-prev { left: max(14px, env(safe-area-inset-left)); }
    #lightbox-next { right: max(14px, env(safe-area-inset-right)); }
    #lightbox-prev:active, #lightbox-next:active { transform: translateY(-50%) scale(.92); }

    #lightbox-close {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 101;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--accent);
      background: var(--glass);
      cursor: pointer;
    }
    #lightbox-caption {
      margin-top: 12px;
      text-align: center;
      color: rgba(240,98,146,.65);
      font: 11px/1.4 Georgia, serif;
      letter-spacing: .18em;
    }

    @media (max-width: 1000px) {
      .gallery { column-count: 3; column-gap: 18px; }
      .photo-card { margin-bottom: 18px; }
    }
    @media (max-width: 700px) {
      #lightbox-prev, #lightbox-next {
        width: 42px;
        height: 42px;
        font-size: 29px;
      }
      main { width: calc(100% - 18px); padding-top: 38px; }
      header { margin-bottom: 30px; }
      h1 { font-size: clamp(26px, 8vw, 38px); letter-spacing: .08em; }
      .gallery { column-count: 2; column-gap: 12px; }
      .photo-card { margin-bottom: 12px; border-radius: 16px; }
      #controls { gap: 8px; }
      .ctrl-btn { width: 46px; height: 46px; }
      #music-panel { min-width: 170px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="loading-inner">
      <div class="loading-ring"></div>
      <div>正在打开相册</div>
    </div>
  </div>

  <div id="app">
    <main>
      <header>
        <h1>ZJ's Photo | 相册</h1>
        <div class="divider"></div>
      </header>

      <section class="gallery" id="gallery" aria-label="照片墙"></section>
    </main>
  </div>

  <div id="controls">
    <button id="btn-theme" class="ctrl-btn" type="button" aria-label="切换深色模式" title="切换深色模式">
      <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.35 15.35A9 9 0 0 1 8.65 3.65 9 9 0 1 0 20.35 15.35Z"/>
      </svg>
      <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none">
        <circle cx="12" cy="12" r="4"/>
        <path stroke-linecap="round" d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M19.07 4.93l-1.41 1.41M6.34 17.66l-1.41 1.41"/>
      </svg>
    </button>

    <button id="btn-scroll" class="ctrl-btn" type="button" aria-label="自动滚动" title="自动滚动">
      <svg id="icon-scroll-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="m19 13-7 7-7-7m14-8-7 7-7-7"/>
      </svg>
      <svg id="icon-scroll-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none">
        <path stroke-linecap="round" d="M10 8v8M14 8v8"/>
      </svg>
    </button>
  </div>

  <div id="music-panel" aria-label="背景音乐">
    <button id="btn-music-play" type="button" aria-label="播放或暂停音乐">
      <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
    </button>
    <div id="music-track-name">♪ bgm</div>
    <div id="music-progress-wrap"><div id="music-progress-bar"></div></div>
  </div>

  <div id="lightbox" aria-hidden="true">
    <button id="lightbox-prev" type="button" aria-label="上一张">‹</button>
    <button id="lightbox-next" type="button" aria-label="下一张">›</button>
    <button id="lightbox-close" type="button" aria-label="关闭照片">✕</button>
    <div id="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <div id="lightbox-caption"></div>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    /*
      项目结构保持不变：
      images/p01.jpg ... images/p20.jpg
      music/bgm.mp3
    */
    const PHOTO_COUNT = 20;
    const photos = Array.from(
      { length: PHOTO_COUNT },
      (_, i) => `./images/p${String(i + 1).padStart(2, "0")}.jpg`
    );

    const $ = id => document.getElementById(id);
    const gallery = $("gallery");
    const loading = $("loading");
    const app = $("app");

    // ---------- 图片 ----------
    const observer = "IntersectionObserver" in window
      ? new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const img = entry.target;
            img.src = img.dataset.src;
            observer.unobserve(img);
          });
        }, { rootMargin: "500px 0px" })
      : null;

    function createCard(src, index) {
      const card = document.createElement("article");
      card.className = "photo-card";

      const placeholder = document.createElement("div");
      placeholder.className = "placeholder";

      const img = document.createElement("img");
      img.alt = `照片 ${index + 1}`;
      img.decoding = "async";
      img.dataset.src = src;

      // 首屏前两张直接加载，其余交给 IntersectionObserver。
      if (index < 2) {
        img.src = src;
        img.fetchPriority = "high";
      } else if (observer) {
        observer.observe(img);
      } else {
        img.src = src;
      }

      img.addEventListener("load", () => {
        img.classList.add("loaded");
        card.classList.add("done");
      }, { once: true });

      img.addEventListener("error", () => {
        card.classList.add("done");
        placeholder.style.display = "none";
      }, { once: true });

      const overlay = document.createElement("div");
      overlay.className = "overlay";
      overlay.innerHTML = "<span>✧</span>";

      card.append(placeholder, img, overlay);
      card.addEventListener("click", () => openLightbox(src, index));
      return card;
    }

    // 只创建 20 张卡片，不再复制成 120 张，也不再同时创建 desktop/mobile 两套。
    photos.forEach((src, i) => gallery.appendChild(createCard(src, i)));

    // ---------- Lightbox ----------
    const lightbox = $("lightbox");
    const lightboxImg = $("lightbox-img");
    const lightboxCaption = $("lightbox-caption");

    let currentPhoto = 0;

    function showPhoto(index, animate = true) {
      currentPhoto = (index + photos.length) % photos.length;
      const src = photos[currentPhoto];
      if (animate) {
        lightboxImg.style.opacity = "0";
        lightboxImg.style.transform = "scale(.985)";
        requestAnimationFrame(() => {
          lightboxImg.src = src;
          lightboxImg.alt = `照片 ${currentPhoto + 1}`;
          lightboxCaption.textContent = `${String(currentPhoto + 1).padStart(2, "0")}  /  ${String(photos.length).padStart(2, "0")}`;
          lightboxImg.onload = () => {
            lightboxImg.style.opacity = "1";
            lightboxImg.style.transform = "scale(1)";
          };
        });
      } else {
        lightboxImg.src = src;
        lightboxImg.alt = `照片 ${currentPhoto + 1}`;
        lightboxCaption.textContent = `${String(currentPhoto + 1).padStart(2, "0")}  /  ${String(photos.length).padStart(2, "0")}`;
      }
    }

    function openLightbox(src, index) {
      showPhoto(index, false);
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    $("lightbox-close").addEventListener("click", closeLightbox);
    $("lightbox-prev").addEventListener("click", () => showPhoto(currentPhoto - 1));
    $("lightbox-next").addEventListener("click", () => showPhoto(currentPhoto + 1));

    let touchStartX = 0;
    lightbox.addEventListener("touchstart", e => {
      touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });
    lightbox.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 45) {
        showPhoto(currentPhoto + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });

    lightbox.addEventListener("click", e => {
      if (e.target === lightbox) closeLightbox();
    });
    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") showPhoto(currentPhoto - 1);
      if (e.key === "ArrowRight") showPhoto(currentPhoto + 1);
    });

    // ---------- 深色 / 浅色 ----------
    const html = document.documentElement;
    const themeBtn = $("btn-theme");
    const moon = $("icon-moon");
    const sun = $("icon-sun");

    function setTheme(theme) {
      html.dataset.theme = theme;
      const dark = theme === "dark";
      moon.style.display = dark ? "none" : "";
      sun.style.display = dark ? "" : "none";
      document.querySelector('meta[name="theme-color"]').setAttribute(
        "content", dark ? "#120f10" : "#fff9fa"
      );
      try { localStorage.setItem("photo-theme", theme); } catch (_) {}
    }

    let savedTheme = null;
    try { savedTheme = localStorage.getItem("photo-theme"); } catch (_) {}
    setTheme(savedTheme === "dark" ? "dark" : "light");

    themeBtn.addEventListener("click", () => {
      setTheme(html.dataset.theme === "dark" ? "light" : "dark");
    });

    // ---------- 音乐 ----------
    // 不再为了“检测音乐”而逐个等待多个不存在的文件。
    // 直接使用项目结构中的 music/bgm.mp3。
    const audio = new Audio("./music/bgm.mp3");
    audio.loop = true;
    audio.preload = "metadata";

    const playBtn = $("btn-music-play");
    const playIcon = $("icon-play");
    const pauseIcon = $("icon-pause");
    const progress = $("music-progress-bar");

    playBtn.addEventListener("click", async () => {
      try {
        if (audio.paused) {
          await audio.play();
          playIcon.style.display = "none";
          pauseIcon.style.display = "";
        } else {
          audio.pause();
          playIcon.style.display = "";
          pauseIcon.style.display = "none";
        }
      } catch (_) {
        // 浏览器若阻止播放，不阻塞页面其它功能。
      }
    });

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        progress.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
      }
    });

    audio.addEventListener("pause", () => {
      playIcon.style.display = "";
      pauseIcon.style.display = "none";
    });

    // ---------- 自动滚动 ----------
    // 原版每一帧都 scrollBy，会持续制造滚动任务。
    // 这里降低调用频率，让手指自由滑动更容易保持流畅。
    let autoScroll = false;
    let scrollTimer = null;

    function scrollStep() {
      if (!autoScroll) return;
      window.scrollBy(0, 1);
      scrollTimer = setTimeout(scrollStep, 24);
    }

    $("btn-scroll").addEventListener("click", () => {
      autoScroll = !autoScroll;
      $("btn-scroll").classList.toggle("active", autoScroll);
      $("icon-scroll-off").style.display = autoScroll ? "none" : "";
      $("icon-scroll-on").style.display = autoScroll ? "" : "none";

      if (autoScroll) {
        clearTimeout(scrollTimer);
        scrollStep();
      } else {
        clearTimeout(scrollTimer);
      }
    });

    // 页面本身不再等待全部图片/音乐下载完成才显示。
    // HTML 建好即可进入相册，图片按需加载。
    requestAnimationFrame(() => {
      loading.style.display = "none";
      app.classList.add("ready");
    });
  })();
  </script>
</body>
</html>
