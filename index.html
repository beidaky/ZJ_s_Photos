<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muse Gallery | Sakura Dream</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<!-- 字体非阻塞加载：Google Fonts 在国内加载不出来也不会拖慢页面 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#fff9fa;--text:#4a4a4a;--soft:#fce4ec;--main:#f06292;--card:#fff;--panel:rgba(255,255,255,.86);--lb:rgba(255,249,250,.95);--gap:clamp(.75rem,2.2vw,2rem);--r:clamp(1.1rem,3vw,2.5rem)}
[data-theme=dark]{--bg:#120f10;--text:#fce4ec;--soft:#2a1b1f;--main:#ff80ab;--card:#1a1617;--panel:rgba(30,22,25,.88);--lb:rgba(18,15,16,.95)}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cormorant Garamond','Songti SC','Noto Serif SC',Georgia,serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;scrollbar-width:none}
::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

header{text-align:center;padding:3rem 1rem 3.5rem;animation:in 1.2s ease both}
h1{margin:0;font-size:clamp(1.8rem,5vw,3.5rem);font-style:italic;font-weight:300;letter-spacing:.25em;color:rgba(240,98,146,.8)}
.divider{width:4rem;height:1px;margin:1rem auto 0;background:linear-gradient(to right,transparent,rgba(240,98,146,.4),transparent)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}

main{max-width:1500px;margin:0 auto;padding:0 1rem 5rem}
#grid{display:flex;gap:var(--gap);align-items:flex-start;min-height:50vh}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--gap)}
#hint{text-align:center;color:rgba(240,98,146,.6);letter-spacing:.2em;text-transform:uppercase;padding:4rem 0}
#end{height:30vh;display:flex;align-items:center;justify-content:center}
#end i{width:.4rem;height:.4rem;border-radius:50%;background:var(--main);opacity:.35}

/* 卡片：只对 transform/opacity 做动画；屏幕外的卡片不渲染 */
.card{display:block;position:relative;width:100%;overflow:hidden;border-radius:var(--r);background:var(--soft);content-visibility:auto;contain-intrinsic-size:auto 320px}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .8s ease both;transition:transform .9s cubic-bezier(.19,1,.22,1)}
.card span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.9rem;opacity:0;transition:opacity .5s;background:rgba(0,0,0,.05);text-shadow:0 4px 8px rgba(0,0,0,.4)}
@media(hover:hover){.card:hover img{transform:scale(1.06)}.card:hover span{opacity:1}.card:hover{box-shadow:0 30px 60px -15px rgba(240,98,146,.28)}}
.card:active{transform:scale(.985)}
.card:focus-visible,.btn:focus-visible,#play:focus-visible{outline:2px solid var(--main);outline-offset:3px}

/* 按钮：不使用 backdrop-filter（滚动时重绘开销很大） */
#ctrl{position:fixed;right:max(1rem,2vw);bottom:max(1rem,2vw);z-index:40;display:flex;flex-direction:column;gap:.9rem}
.btn{width:3.4rem;height:3.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid rgba(240,98,146,.25);color:var(--main);box-shadow:0 8px 24px rgba(0,0,0,.1);transition:transform .3s}
.btn:active{transform:scale(.92)}
.btn svg{width:1.4rem;height:1.4rem}
.btn.on{background:rgba(240,98,146,.16);border-color:rgba(240,98,146,.6)}
[data-theme=dark] .moon,html:not([data-theme=dark]) .sun,.btn:not(.on) .pa,.btn.on .dn{display:none}

#music{position:fixed;left:max(1rem,2vw);bottom:max(1rem,2vw);z-index:40;display:none;align-items:center;gap:.7rem;min-width:10.5rem;padding:.8rem 1.2rem .8rem 1rem;border-radius:1.5rem;overflow:hidden;background:var(--panel);border:1px solid rgba(240,98,146,.25);box-shadow:0 8px 24px rgba(0,0,0,.1)}
#music.show{display:flex}
#play{color:var(--main);display:flex;flex-shrink:0}
#play svg{width:1.4rem;height:1.4rem;fill:currentColor;stroke:none}
#play .ps,#music.playing .pl{display:none}#music.playing .ps{display:block}
#track{font-size:.8rem;letter-spacing:.12em;color:rgba(240,98,146,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:8rem}
#bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(to right,#f06292,#ff80ab);transform:scaleX(0);transform-origin:left}

/* 大图 */
#lb{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--lb);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
#lb.open{opacity:1;visibility:visible;transition:opacity .4s}
#lbi{max-width:88vw;max-height:80vh;object-fit:contain;border-radius:var(--r);border:4px solid var(--card);box-shadow:0 30px 80px rgba(0,0,0,.25);transform:scale(.96);transition:transform .6s cubic-bezier(.19,1,.22,1)}
#lb.open #lbi{transform:none}
#cap{position:absolute;left:0;right:0;bottom:1.6rem;text-align:center;font-size:.8rem;letter-spacing:.3em;color:rgba(240,98,146,.6)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:3.4rem;height:3.4rem;color:rgba(240,98,146,.6);display:flex;align-items:center;justify-content:center}
.nav:hover{color:var(--main)}.nav svg{width:2rem;height:2rem}
#prev{left:.5rem}#next{right:.5rem}
#x{position:absolute;top:1rem;right:1rem;width:3rem;height:3rem;color:rgba(240,98,146,.6);display:flex;align-items:center;justify-content:center}
#x svg{width:2rem;height:2rem}
::view-transition-group(root){animation-duration:.45s}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<header><h1>ZJ's Photo | 相册</h1><div class="divider"></div></header>
<main>
  <div id="hint">Curating Dreamscape</div>
  <div id="grid"></div>
  <div id="end"><i></i></div>
</main>

<div id="ctrl">
  <button class="btn" id="theme" aria-label="切换深色/浅色">
    <svg class="moon" viewBox="0 0 24 24"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    <svg class="sun" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
  </button>
  <button class="btn" id="auto" aria-label="自动滚动">
    <svg class="dn" viewBox="0 0 24 24"><path d="M19 13l-7 7-7-7m14-8l-7 7-7-7"/></svg>
    <svg class="pa" viewBox="0 0 24 24"><path d="M10 9v6m4-6v6"/></svg>
  </button>
</div>

<div id="music">
  <button id="play" aria-label="播放/暂停音乐">
    <svg class="pl" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg class="ps" viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
  </button>
  <div id="track">♪</div><div id="bar"></div>
</div>

<div id="lb" aria-hidden="true">
  <button id="x" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg></button>
  <button class="nav" id="prev" aria-label="上一张"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="nav" id="next" aria-label="下一张"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <img id="lbi" alt=""><div id="cap"></div>
</div>

<script>
(()=>{
/* ═══ 配置区 ═══
   图片：images/p01.jpg、p02.jpg …（也认 p1.jpg 及 jpeg/png/webp）。加图后直接按序号放进去即可，会自动识别。
   大图（可选）：把原图放进 images/full/，文件名与小图一致（p01.jpg…），点开大图时才会加载原图；没有这个文件夹就用小图。
   音乐：music/bgm.mp3，点播放才开始下载，不影响打开速度。 */
const KNOWN=20, MAX=60, EXTS=['jpg','jpeg','png','webp'];
const FULL_DIR='./images/full/';
const MUSIC=['./music/bgm.mp3','./music/bgm.ogg','./music/bgm.wav','./music/music.mp3','./music/music.ogg','./music/background.mp3'];
const SPEED=50;      // 自动滚动速度（像素/秒）
const MAX_ROUNDS=30; // 相册循环轮数上限

const $=s=>document.querySelector(s), root=document.documentElement;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const photos=[], cards=[]; let rounds=0, ready=false;

/* ── 图片探测：按顺序逐张显示，不再等全部下载完 ── */
let hit=null;
const probe=u=>new Promise(r=>{const i=new Image();i.decoding='async';i.onload=()=>r({url:u,w:i.naturalWidth,h:i.naturalHeight,name:u.split('/').pop()});i.onerror=()=>r(null);i.src=u});
async function find(n){
  const pad=String(n).padStart(2,'0'), list=[];
  for(const e of EXTS)for(const p of [pad,String(n)])list.push([e,p===pad]);
  if(hit)list.sort((a,b)=>(b[0]===hit[0]&&b[1]===hit[1])-(a[0]===hit[0]&&a[1]===hit[1]));
  for(const [e,z] of list){const r=await probe(`./images/p${z?pad:n}.${e}`);if(r){hit=[e,z];return r}}
  return null;
}
async function load(){
  const first=Array.from({length:KNOWN},(_,i)=>find(i+1));
  for(const p of first){const r=await p;if(r)addPhoto(r)}
  for(let n=KNOWN+1;n<=MAX;n++){const r=await find(n);if(!r)break;addPhoto(r)}
  if(!photos.length)$('#hint').textContent='还没有找到图片（images/p01.jpg …）';
  ready=true;io.disconnect();io.observe($('#end'));findMusic();
}
function addPhoto(p){photos.push(p);if(!rounds)$('#hint').style.display='none';add(photos.length-1,true)}

/* ── 瀑布流：单份 DOM，按宽度切 2/3/4 列 ── */
let n=0,cols=[],hs=[];
const colN=()=>innerWidth<700?2:innerWidth<1100?3:4;
function mount(){
  n=colN();const g=$('#grid');g.textContent='';
  cols=Array.from({length:n},()=>{const c=document.createElement('div');c.className='col';g.append(c);return c});
  hs=Array(n).fill(0);cards.forEach(place);
}
function place(c){let s=0;for(let i=1;i<n;i++)if(hs[i]<hs[s])s=i;cols[s].append(c.el);hs[s]+=c.r+.08}
function add(idx,eager){
  const p=photos[idx],el=document.createElement('button'),im=new Image(),st=document.createElement('span');
  el.className='card';el.style.aspectRatio=p.w+'/'+p.h;el.setAttribute('aria-label','查看第 '+(idx+1)+' 张');
  im.src=p.url;im.alt='';im.decoding='async';if(!eager)im.loading='lazy';st.textContent='✧';
  el.append(im,st);el.onclick=()=>openLB(idx);
  const c={el,r:p.h/p.w};cards.push(c);place(c);
}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(colN()!==n)mount()},150)});
const io=new IntersectionObserver(e=>{
  if(!ready||!e[0].isIntersecting||!photos.length||rounds>=MAX_ROUNDS)return;
  rounds++;photos.forEach((_,i)=>add(i,false));
},{rootMargin:'1500px 0px'});
rounds=1;mount();load();
new MutationObserver(()=>{}).disconnect();

/* ── 大图 ── */
const lb=$('#lb'),lbi=$('#lbi');let cur=0,fullOK=true;
function show(i){
  cur=(i+photos.length)%photos.length;const p=photos[cur];
  lbi.src=p.url;$('#cap').textContent=`Captured Muse · ${p.name} · ${cur+1}/${photos.length}`;
  if(fullOK){const f=FULL_DIR+p.name,t=new Image();t.onload=()=>{if(photos[cur]===p)lbi.src=f};t.onerror=()=>{fullOK=false};t.src=f}
}
function openLB(i){show(i);lb.classList.add('open');lb.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('#x').focus()}
function closeLB(){lb.classList.remove('open');lb.setAttribute('aria-hidden','true');document.body.style.overflow=''}
$('#x').onclick=closeLB;$('#prev').onclick=()=>show(cur-1);$('#next').onclick=()=>show(cur+1);
lb.onclick=e=>{if(e.target===lb)closeLB()};
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLB();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
let sx=0;lb.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)show(cur+(d<0?1:-1))});

/* ── 主题：切换时只重算一次样式，并用系统过渡做淡入淡出 ── */
$('#theme').onclick=()=>{
  const t=root.dataset.theme==='dark'?'light':'dark';
  const apply=()=>{root.dataset.theme=t;pal()};
  document.startViewTransition&&!reduce?document.startViewTransition(apply):apply();
  try{localStorage.setItem('theme',t)}catch(e){}
};

/* ── 自动滚动：按时间计算速度，用户一滚动就自动停下 ── */
let auto=false,raf=0,last=0,pos=0;const ab=$('#auto');
function step(t){
  if(!auto)return;
  const dt=Math.min(t-last,50);last=t;
  if(!lb.classList.contains('open')){
    const y=scrollY;if(Math.abs(y-pos)>3)pos=y;
    pos+=SPEED*dt/1000;scrollTo(0,pos);
    if(rounds>=MAX_ROUNDS&&y+innerHeight>=root.scrollHeight-2)return setAuto(false);
  }
  raf=requestAnimationFrame(step);
}
function setAuto(v){auto=v;ab.classList.toggle('on',v);cancelAnimationFrame(raf);if(v){pos=scrollY;last=performance.now();raf=requestAnimationFrame(step)}}
ab.onclick=()=>setAuto(!auto);
['wheel','touchstart','keydown'].forEach(k=>addEventListener(k,()=>auto&&setAuto(false),{passive:true}));

/* ── 音乐：点播放才下载；播放/暂停带淡入淡出 ── */
const au=new Audio(),mu=$('#music');au.loop=true;au.preload='none';
async function findMusic(){
  for(const u of MUSIC){
    try{const r=await fetch(u,{method:'HEAD'});if(!r.ok)continue}catch(e){}
    au.src=u;$('#track').textContent='♪  '+u.split('/').pop().replace(/\.[^.]+$/,'').replace(/[-_]/g,' ');mu.classList.add('show');return;
  }
}
let fd;function fadeTo(v,done){clearInterval(fd);fd=setInterval(()=>{const d=v-au.volume;if(Math.abs(d)<.04){au.volume=v;clearInterval(fd);done&&done()}else au.volume=Math.max(0,Math.min(1,au.volume+Math.sign(d)*.04))},30)}
$('#play').onclick=()=>{
  if(au.paused){au.volume=0;au.play().then(()=>{mu.classList.add('playing');fadeTo(.7)}).catch(()=>{})}
  else{mu.classList.remove('playing');fadeTo(0,()=>au.pause())}
};
au.addEventListener('timeupdate',()=>{if(au.duration)$('#bar').style.transform=`scaleX(${au.currentTime/au.duration})`});

/* ── 鼠标光点：只在有粒子时才跑动画，数量封顶，仅鼠标设备 ── */
const cv=$('#fx'),cx=cv.getContext('2d');let W,H,ps=[],run=false,mx=0,my=0,moved=false,cols2=[];
function pal(){const d=root.dataset.theme==='dark';cols2=[340,348,356].map(h=>`hsl(${h},${d?80:100}%,${d?60:80}%)`)}
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
pal();size();addEventListener('resize',size);
if(!reduce&&matchMedia('(hover:hover)').matches){
  addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;mx=e.clientX;my=e.clientY;moved=true;if(!run){run=true;requestAnimationFrame(tick)}},{passive:true});
}
function tick(){
  cx.clearRect(0,0,W,H);
  if(moved&&ps.length<120){for(let i=0;i<2;i++)ps.push({x:mx,y:my,vx:Math.random()*2-1,vy:Math.random()*2-1,l:1,s:Math.random()*4+1,c:cols2[i%3]});moved=false}
  for(let i=ps.length-1;i>=0;i--){
    const p=ps[i];p.x+=p.vx;p.y+=p.vy;p.l-=.02;
    if(p.l<=0){ps[i]=ps[ps.length-1];ps.pop();continue}
    cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill();
  }
  if(ps.length||moved)requestAnimationFrame(tick);else run=false;
}
})();
</script>
</body>
</html>
